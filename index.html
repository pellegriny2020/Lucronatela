<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucro na Tela - O App do Motoka e Motorista Inteligente</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,800;1,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #080b0e;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.4;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 255, 136, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 10% 40%, rgba(255, 170, 0, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #080b0e 0%, #030507 100%);
    }
    .container { max-width: 1040px; margin: 0 auto; padding: 30px 20px 80px 20px; text-align: center; }
    .logo-container { margin-bottom: 24px; display: inline-block; position: relative; }
    .logo-badge {
      width: 120px; height: 120px; border-radius: 50%;
      background: radial-gradient(circle, #0e1e13 0%, #050a07 100%);
      border: 3px solid #00ff88;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.5), inset 0 0 15px rgba(0, 255, 136, 0.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto;
    }
    .logo-badge .lc {
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; font-size: 38px;
      background: linear-gradient(135deg, #00ff88 0%, #ffd000 60%, #ff8800 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.95;
    }
    .logo-badge .sub {
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 9px; color: #ffd000;
      letter-spacing: 1px; margin-top: 2px; text-shadow: 0 0 6px rgba(255, 208, 0, 0.6);
    }
    .main-title {
      font-family: 'Montserrat', sans-serif; font-style: italic; font-weight: 900;
      font-size: clamp(24px, 5.5vw, 44px); text-transform: uppercase; letter-spacing: -0.5px;
      line-height: 1.15; margin-bottom: 14px; color: #ffffff;
    }
    .main-title span {
      background: linear-gradient(90deg, #00ff88, #26e6a3);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: clamp(14px, 2.5vw, 17px); color: #9eb1c2; max-width: 680px; margin: 0 auto 30px auto; }
    .subtitle strong { color: #ffffff; }
    .btn-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
      color: #002b11; font-family: 'Montserrat', sans-serif; font-weight: 900;
      font-size: clamp(16px, 3.5vw, 21px); text-transform: uppercase; padding: 18px 42px;
      border-radius: 50px; text-decoration: none; box-shadow: 0 0 30px rgba(0, 255, 136, 0.45);
      transition: all 0.25s ease; border: none; cursor: pointer;
    }
    .btn-cta:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 45px rgba(0, 255, 136, 0.7); }
    .cta-note { margin-top: 10px; font-size: 13px; color: #6d8294; font-weight: 500; }
    .phones-showcase {
      display: flex; justify-content: center; align-items: center; gap: 18px; margin: 50px 0 60px 0; flex-wrap: wrap;
    }
    .phone-mockup {
      width: 270px; background: #0f141a; border-radius: 36px; border: 4px solid #1c2630;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 136, 0.15);
      padding: 12px;
    }
    .phone-mockup.featured {
      transform: scale(1.04); border-color: #00ff88; box-shadow: 0 25px 55px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 136, 0.35); z-index: 2;
    }
    .phone-screen {
      background: #f4f6f8; border-radius: 26px; color: #1a1a1a; padding: 14px 10px; text-align: left; font-size: 11px; min-height: 480px; display: flex; flex-direction: column;
    }
    .screen-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; margin-bottom: 10px; color: #0b1f14; }
    .app-badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
    .app-chip { padding: 5px 2px; border-radius: 6px; color: #fff; font-weight: 800; text-align: center; font-size: 9px; }

    .chip-99f { background: #f6ab00; }
    .chip-keeta { background: #ffcc00; color: #000; }
